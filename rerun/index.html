/* ---- soothing timing ---- */
const FADE    = 1800;            // matches the CSS transition exactly
const HOLD    = 10000;           // 10s per quote, start to start
const VISIBLE = HOLD - FADE;     // time fully legible before fading out

const stage = document.getElementById('stage');
const elQ   = document.getElementById('quote');
const elWho = document.getElementById('who');
const elMet = document.getElementById('meta');

/* shuffled bag: nothing repeats until all 52 have shown */
let bag = [];
function refill(){
  bag = Q.map(function(_, i){ return i; });
  for(var i = bag.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = bag[i]; bag[i] = bag[j]; bag[j] = t;
  }
}
refill();

function paint(){
  if(!bag.length) refill();
  var q = Q[bag.pop()];
  elQ.textContent   = '\u201C' + q.q + '\u201D';
  elWho.textContent = q.who;
  var meta = '<span class="show">' + q.show + '</span>';
  if(q.ep){
    /* episode-cited: season / episode / title / air date */
    meta += '<br>Season ' + q.s + ' &nbsp;&middot;&nbsp; Episode ' + q.e +
            ' &nbsp;&middot;&nbsp; \u201C' + q.ep + '\u201D' +
            '<br>' + q.aired;
  } else {
    /* video-cited: the music video IS the citation for these segments */
    meta += '<br><span class="artist">' + q.artist + '</span>' +
            ' &nbsp;&middot;&nbsp; \u201C' + q.song + '\u201D' +
            '<br>Music video commentary';
  }
  elMet.innerHTML = meta;
}

function show(){
  paint();
  requestAnimationFrame(function(){ stage.classList.add('in'); });
  setTimeout(hide, VISIBLE);
}

function hide(){
  stage.classList.remove('in');
  setTimeout(show, FADE);
}

show();
</script>
