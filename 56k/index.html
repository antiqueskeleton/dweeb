  :root{
    --chrome:#c0c0c0; --chrome-dk:#808080; --chrome-lt:#dfdfdf;
    --title-a1:#000080; --title-a2:#1084d0; --title-i:#808080;
    --desk:#008080; --honey:#e6b352;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#000; overflow:hidden;
    font-family:Tahoma,"MS Sans Serif",Arial,sans-serif; font-size:11px;
    -webkit-user-select:none; user-select:none;
  }
  /* the two-tone Win95 bevel, as box-shadows */
  .bo{ box-shadow: inset -1px -1px 0 #0a0a0a, inset 1px 1px 0 #fff,
                   inset -2px -2px 0 var(--chrome-dk), inset 2px 2px 0 var(--chrome-lt); }
  .bi{ box-shadow: inset 1px 1px 0 #0a0a0a, inset -1px -1px 0 #fff,
                   inset 2px 2px 0 var(--chrome-dk), inset -2px -2px 0 var(--chrome-lt); }
  .bthin{ box-shadow: inset -1px -1px 0 var(--chrome-dk), inset 1px 1px 0 #fff; }
  .bthin-in{ box-shadow: inset 1px 1px 0 var(--chrome-dk), inset -1px -1px 0 #fff; }

  /* ---------- boot ---------- */
  #boot{ position:fixed; inset:0; background:#000; z-index:9000;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; }
  #boot .logo{ font-family:VT323,monospace; font-size:64px; color:#fff; letter-spacing:2px;
               display:flex; align-items:center; gap:18px; }
  #boot .logo .hex{ width:44px; height:50px; }
  #boot .logo .n95{ color:var(--honey); }
  #boot .tag{ font-family:VT323,monospace; font-size:18px; color:#888; margin-top:-14px; }
  #boot .barw{ width:min(420px,70vw); height:16px; border:1px solid #555; padding:2px; }
  #boot .bar{ height:100%; width:0%; background:repeating-linear-gradient(90deg,#2a6cad 0 8px,#3f8fd4 8px 16px); }
  #boot .txt{ font-family:VT323,monospace; font-size:17px; color:#0c0; min-height:22px; }

  /* ---------- desktop ---------- */
  #desktop{ position:fixed; inset:0 0 28px 0; background:var(--desk); display:none; overflow:hidden; }
  #desktop.wp-hex{ background-color:var(--desk);
    background-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.13) 1px, transparent 1px);
    background-size:14px 14px; }
  #desktop.wp-check{ background-color:#007070;
    background-image:linear-gradient(45deg, rgba(0,0,0,.10) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.10) 75%),
                     linear-gradient(45deg, rgba(0,0,0,.10) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.10) 75%);
    background-position:0 0, 8px 8px; background-size:16px 16px; }
  #desktop.wp-gray{ background:#5f7a7a; }

  #icons{ position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:14px; }
  .dicon{ width:76px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:default; }
  .dicon img{ width:32px; height:32px; image-rendering:pixelated; }
  .dicon .lbl{ color:#fff; text-align:center; padding:1px 3px; line-height:1.25;
               text-shadow:1px 1px 0 #000; }

  /* ---------- windows ---------- */
  .win{ position:absolute; background:var(--chrome); display:flex; flex-direction:column;
        min-width:180px; min-height:100px; }
  .win .tbar{ height:20px; margin:3px; padding:0 2px 0 3px; display:flex; align-items:center; gap:4px;
        background:linear-gradient(90deg,var(--title-a1),var(--title-a2)); color:#fff; font-weight:700;
        letter-spacing:.2px; }
  .win.inactive .tbar{ background:var(--title-i); color:#d0d0d0; }
  .win .tbar img{ width:16px; height:16px; image-rendering:pixelated; }
  .win .tbar .ttl{ flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:default; }
  .wbtn{ width:16px; height:14px; background:var(--chrome); display:flex; align-items:center;
         justify-content:center; font-family:Tahoma; font-size:9px; font-weight:700; color:#000; }
  .wbtn:active{ box-shadow: inset 1px 1px 0 #0a0a0a, inset -1px -1px 0 #fff; }
  .win .body{ flex:1; display:flex; flex-direction:column; margin:0 3px 3px; overflow:hidden; }
  .menubar{ display:flex; gap:1px; padding:1px 0 2px; }
  .menubar .mi{ padding:2px 7px; }
  .menubar .mi:hover, .menubar .mi.open{ background:#000080; color:#fff; }
  .menu{ position:absolute; background:var(--chrome); padding:2px; z-index:5; min-width:150px; }
  .menu .it{ padding:3px 18px 3px 24px; white-space:nowrap; position:relative; }
  .menu .it:hover{ background:#000080; color:#fff; }
  .menu .sep{ height:0; border-top:1px solid var(--chrome-dk); border-bottom:1px solid #fff; margin:3px 1px; }
  .grip{ position:absolute; right:3px; bottom:3px; width:13px; height:13px; cursor:nwse-resize;
         background:
          linear-gradient(135deg, transparent 0 5px, #808080 5px 6.5px, #fff 6.5px 8px,
            transparent 8px 9.5px, #808080 9.5px 11px, #fff 11px 12.5px, transparent 12.5px); }

  /* ---------- taskbar ---------- */
  #taskbar{ position:fixed; left:0; right:0; bottom:0; height:28px; background:var(--chrome);
            display:flex; align-items:center; gap:3px; padding:2px 3px; z-index:8000;
            box-shadow: inset 0 1px 0 #fff, inset 0 2px 0 var(--chrome-lt); }
  #startbtn{ height:22px; display:flex; align-items:center; gap:4px; padding:0 6px; font-weight:700; }
  #startbtn img{ width:16px; height:16px; image-rendering:pixelated; }
  #startbtn.on{ box-shadow: inset 1px 1px 0 #0a0a0a, inset -1px -1px 0 #fff,
                inset 2px 2px 0 var(--chrome-dk); }
  #tasks{ flex:1; display:flex; gap:3px; overflow:hidden; }
  .tbtn{ height:22px; min-width:60px; max-width:160px; flex:1 1 120px; display:flex; align-items:center;
         gap:4px; padding:0 6px; overflow:hidden; white-space:nowrap; }
  .tbtn img{ width:16px; height:16px; image-rendering:pixelated; }
  .tbtn.active{ font-weight:700;
     box-shadow: inset 1px 1px 0 #0a0a0a, inset -1px -1px 0 #fff, inset 2px 2px 0 var(--chrome-dk);
     background:repeating-conic-gradient(#fff 0 25%, #c0c0c0 0 50%) 0 0/4px 4px; }
  #tray{ height:22px; display:flex; align-items:center; gap:6px; padding:0 8px; }
  #tray img{ width:14px; height:14px; image-rendering:pixelated; }

  /* ---------- start menu ---------- */
  #smenu{ position:fixed; left:2px; bottom:30px; background:var(--chrome); display:none; z-index:8500; }

  #smenu .band b{ color:var(--honey); }
  #smenu .items{ padding:2px; min-width:170px; }

  #smenu .it:hover{ background:#000080; color:#fff; }

  #smenu .sub{ position:absolute; left:100%; top:-3px; background:var(--chrome); padding:2px; display:none; }
  #smenu .it:hover .sub{ display:block; }
  #smenu .sub .it{ padding:4px 16px 4px 6px; }

  .addr{ display:flex; align-items:center; gap:5px; padding:2px 4px 4px; }

  .navframe{ flex:1; background:#fff; }

  .npad{ flex:1; font:13px "Courier New",monospace; background:#fff; border:0; resize:none;

  .paintbar{ display:flex; gap:3px; padding:3px; align-items:center; flex-wrap:wrap; }

  .paintwrap{ flex:1; overflow:auto; background:#808080; padding:6px; }
  .paintwrap canvas{ background:#fff; cursor:crosshair; image-rendering:pixelated; }

  .mine{ display:flex; flex-direction:column; gap:6px; padding:8px; align-items:center; }
  .mine .top{ display:flex; gap:10px; align-items:center; justify-content:space-between; width:100%; padding:4px 6px; }

  .face{ width:26px; height:26px; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .grid9{ display:grid; grid-template-columns:repeat(9,20px); }
  .cell{ width:20px; height:20px; display:flex; align-items:center; justify-content:center;
         font:700 12px Tahoma; background:var(--chrome); }

  .c1{color:#0000ff}.c2{color:#008000}.c3{color:#ff0000}.c4{color:#000080}

  .amp{ width:255px; background:#20242c; color:#9ba3b0; font-family:VT323,monospace; padding:6px; }
  .amp .trk{ background:#000; color:#00d000; padding:2px 4px; overflow:hidden; white-space:nowrap; }

  .amp .row{ display:flex; gap:6px; align-items:center; margin-top:6px; }
  .amp .time{ font-size:20px; color:#00d000; }
  .amp .eq{ display:flex; gap:2px; align-items:flex-end; height:22px; flex:1; }
  .amp .eq i{ width:6px; background:#2fa84f; animation:eqb .5s ease-in-out infinite alternate; }
  .amp.paused .eq i{ animation-play-state:paused; height:3px !important; }
  .amp.paused .trk span{ animation-play-state:paused; }
  @keyframes eqb{ from{ height:15%; } to{ height:100%; } }
  .amp button{ font-family:Tahoma; font-size:10px; padding:2px 8px; background:var(--chrome); border:0; }

  .fileview{ flex:1; background:#fff; overflow:auto; padding:8px; display:flex; flex-wrap:wrap;
             gap:14px; align-content:flex-start; }
  .fitem{ width:70px; display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center; }
  .fitem img{ width:32px; height:32px; image-rendering:pixelated; }
  .fitem:hover .fl{ background:#000080; color:#fff; }
  .dlg{ padding:14px; display:flex; gap:12px; align-items:flex-start; }
  .dlg img{ width:32px; height:32px; image-rendering:pixelated; }
  .dlg .msg{ line-height:1.5; max-width:260px; -webkit-user-select:text; user-select:text; }
  .dlgbtns{ display:flex; gap:8px; justify-content:center; padding:0 0 12px; }
  .dlgbtns button{ min-width:70px; padding:4px 10px; background:var(--chrome); border:0; font:11px Tahoma; }

  #shutdown{ position:fixed; inset:0; background:#000; z-index:9500; display:none;
             align-items:center; justify-content:center; text-align:center;
             font-family:VT323,monospace; color:#ffb000; font-size:26px; line-height:2; }
  #shutdown small{ font-size:15px; color:#888; }

  @media (prefers-reduced-motion: reduce){
    .amp .eq i, .amp .trk span{ animation:none; }
  }
  @media (max-width:640px){
    .win{ max-width:calc(100vw - 4px); }
  }
</style>
</head>

const iconCache = {};
function icon(name, px){
  const key = name+"@"+px;
  if(iconCache[key]) return iconCache[key];
  const rows = ICONS[name], c = document.createElement("canvas");
  c.width = c.height = 16;
  const g = c.getContext("2d");
  rows.forEach((row,y)=>{ [...row].forEach((ch,x)=>{
    const col = PAL[ch]; if(col){ g.fillStyle=col; g.fillRect(x,y,1,1); } }); });
  const out = document.createElement("canvas");
  out.width = out.height = px;
  const og = out.getContext("2d");
  og.imageSmoothingEnabled = false;
  og.drawImage(c,0,0,px,px);
  return iconCache[key] = out.toDataURL();
}

/* ---------- window manager ---------- */
const desk = document.getElementById("desktop");
const tasks = document.getElementById("tasks");
const WINS = new Map();
let Z = 10, cascade = 0;

function createWindow(cfg){
  if(WINS.has(cfg.id)){ focusWin(cfg.id); return WINS.get(cfg.id); }
  const w = document.createElement("div");
  w.className = "win bo"; w.dataset.id = cfg.id;
  const dw = Math.min(cfg.w||420, innerWidth-8);
  const dh = Math.min(cfg.h||300, innerHeight-40);
  const px = cfg.x!=null ? cfg.x : 30 + (cascade%6)*26;
  const py = cfg.y!=null ? cfg.y : 24 + (cascade%6)*24;
  cascade++;
  Object.assign(w.style,{ left:px+"px", top:py+"px", width:dw+"px", height:dh+"px", zIndex:++Z });
  w.innerHTML =
    '<div class="tbar"><img src="'+icon(cfg.icon,16)+'" alt=""><span class="ttl"></span>'+
    '<div style="display:flex;gap:2px">'+
    '<div class="wbtn bthin" data-a="min">_</div>'+
    (cfg.fixed?'':'<div class="wbtn bthin" data-a="max">□</div>')+
    '<div class="wbtn bthin" data-a="x">✕</div></div></div>'+
    '<div class="body"></div>'+
    (cfg.fixed?'':'<div class="grip"></div>');
  w.querySelector(".ttl").textContent = cfg.title;
  desk.appendChild(w);
  const body = w.querySelector(".body");

  const tb = document.createElement("div");
  tb.className = "tbtn bo";
  tb.innerHTML = '<img src="'+icon(cfg.icon,16)+'" alt=""><span></span>';
  tb.querySelector("span").textContent = cfg.title;
  tasks.appendChild(tb);

  const rec = { el:w, tb, cfg, min:false, max:false, prev:null };
  WINS.set(cfg.id, rec);

  tb.addEventListener("click", ()=>{
    if(rec.min){ rec.min=false; w.style.display="flex"; focusWin(cfg.id); }
    else if(w.style.zIndex==String(Z)) minimizeWin(cfg.id);
    else focusWin(cfg.id);
  });
  w.addEventListener("pointerdown", ()=>focusWin(cfg.id));
  w.querySelectorAll(".wbtn").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const a = b.dataset.a;
    if(a==="min") minimizeWin(cfg.id);
    if(a==="max") maximizeWin(cfg.id);
    if(a==="x") closeWin(cfg.id);
  }));

  /* drag */
  const tbar = w.querySelector(".tbar");
  tbar.addEventListener("pointerdown", e=>{
    if(e.target.closest(".wbtn") || rec.max) return;
    const sx=e.clientX-w.offsetLeft, sy=e.clientY-w.offsetTop;
    const mv = ev=>{
      w.style.left = Math.max(-dw+60, Math.min(innerWidth-40, ev.clientX-sx))+"px";
      w.style.top  = Math.max(0, Math.min(innerHeight-58, ev.clientY-sy))+"px";
    };
    const up = ()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); };
    addEventListener("pointermove",mv); addEventListener("pointerup",up);
  });
  tbar.addEventListener("dblclick", e=>{ if(!e.target.closest(".wbtn") && !cfg.fixed) maximizeWin(cfg.id); });

  /* resize */
  const grip = w.querySelector(".grip");
  if(grip) grip.addEventListener("pointerdown", e=>{
    e.stopPropagation();
    const sw=w.offsetWidth-e.clientX, sh=w.offsetHeight-e.clientY;
    const mv = ev=>{
      w.style.width  = Math.max(200, ev.clientX+sw)+"px";
      w.style.height = Math.max(120, ev.clientY+sh)+"px";
    };
    const up = ()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); };
    addEventListener("pointermove",mv); addEventListener("pointerup",up);
  });

  focusWin(cfg.id);
  if(cfg.mount) cfg.mount(body, rec);
  return rec;
}
function focusWin(id){
  const r = WINS.get(id); if(!r) return;
  r.el.style.zIndex = ++Z;
  WINS.forEach(o=>{ o.el.classList.add("inactive"); o.tb.classList.remove("active"); });
  r.el.classList.remove("inactive"); r.tb.classList.add("active");
}
function minimizeWin(id){ const r=WINS.get(id); if(!r) return;
  r.min=true; r.el.style.display="none"; r.tb.classList.remove("active"); }
function maximizeWin(id){ const r=WINS.get(id); if(!r) return;
  if(r.max){ Object.assign(r.el.style, r.prev); r.max=false; }
  else{ r.prev={left:r.el.style.left,top:r.el.style.top,width:r.el.style.width,height:r.el.style.height};
    Object.assign(r.el.style,{left:"0px",top:"0px",width:"100%",height:(innerHeight-28)+"px"});
    r.max=true; }
}
function closeWin(id){ const r=WINS.get(id); if(!r) return;
  r.el.remove(); r.tb.remove(); WINS.delete(id); }
function setWinTitle(id, t){ const r=WINS.get(id); if(!r) return;
  r.el.querySelector(".ttl").textContent = t; r.tb.querySelector("span").textContent = t; }

/* small dialog helper */

function dialog(title, msg, iconName){

    x:innerWidth/2-165+((dlgN%4)*12), y:innerHeight/3+((dlgN%4)*12),
    mount:(b)=>{
      b.innerHTML = '<div class="dlg"><img src="'+icon(iconName||"doc",32)+'" alt=""><div class="msg">'+msg+
        '</div></div><div class="dlgbtns"><button>OK</button></div>';
      b.querySelector("button").onclick = ()=>closeWin(id);
    }});
}

function bookmarkMenu(){
  return BOOKMARKS.map(b=>[b.label, ()=>loadSite(b.key, true)]);
}

let progTimer = null;
function loadSite(key, push){
  if(!WINS.has("nav")) return;
  const isEnter = key === "enter";
  const page = isEnter ? { url:"http://www.dweeb.co/", title:"welcome" } : PAGES[key];
  if(!page) key = "search";
  const p = isEnter ? page : PAGES[key];

  if(push && navCur && navCur !== key){ navBack.push(navCur); navFwd = []; }
  navCur = key;

  const addr = document.getElementById("nv-addr");
  const status = document.getElementById("nv-status");
  const prog = document.getElementById("nv-prog");
  const frame = document.getElementById("nv-frame");
  addr.value = p.url;
  setWinTitle("nav", p.title + " - " + BRAND);
  status.textContent = "Connecting to " + p.url.replace("http://","").split("/")[0] + "...";
  prog.style.width = "0%";
  clearInterval(progTimer);
  let pr = 0;
  progTimer = setInterval(()=>{ pr += Math.random()*16+6;
    prog.style.width = Math.min(90,pr)+"%"; if(pr>=90) clearInterval(progTimer); }, 80);

  setTimeout(()=>{
    frame.srcdoc = isEnter ? ENTER_PAGE : PAGES[key].html;
    clearInterval(progTimer);
    prog.style.width = "100%";
    status.textContent = "Done";
    setTimeout(()=>{ prog.style.width = "0%"; }, 600);
    updateNavBtns();
  }, 350 + Math.random()*450);
}
function updateNavBtns(){
  const bk = document.getElementById("nv-back"), fw = document.getElementById("nv-fwd");
  if(bk) bk.classList.toggle("dis", !navBack.length);
  if(fw) fw.classList.toggle("dis", !navFwd.length);
}
function navGo(){
  const val = (document.getElementById("nv-addr").value||"").toLowerCase();
  const hit = ["search","mail","geocities","chat","news","hamster","da-office","fanfic",
               "guestbook","help"].find(k=>val.includes(k))
    || (val.includes("office") ? "da-office" : null)
    || (val.includes("irc") ? "chat" : null)
    || (val.includes("hotmail") ? "mail" : null)
    || ((val.includes("dweeb.co")||val.includes("home")) ? "home" : "search");
  loadSite(hit, true);
}

/* ---------- generic dropdown menus ---------- */
let openMenuEl = null;
function openMenu(anchor, items){
  closeMenus();
  const m = document.createElement("div");
  m.className = "menu bo";
  items.forEach(([label, fn])=>{
    if(label==="-"){ const s=document.createElement("div"); s.className="sep"; m.appendChild(s); return; }
    const it = document.createElement("div"); it.className="it"; it.textContent=label;
    it.onclick = ()=>{ closeMenus(); fn(); };
    m.appendChild(it);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 4)+"px";
  m.style.top = (r.bottom+2)+"px";
  m.style.zIndex = ++Z + 500;
  openMenuEl = m;
}
function closeMenus(){ if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; } }
document.addEventListener("pointerdown", e=>{ if(openMenuEl && !openMenuEl.contains(e.target)) closeMenus(); });

function openCalc(){
  createWindow({ id:"calc", title:"dweebCalc", icon:"calc", w:230, h:270, fixed:true,
    mount:(b)=>{
      b.innerHTML = '<div class="calc"><div class="disp bthin-in" id="cd">0</div><div class="keys"></div></div>';
      const disp = b.querySelector("#cd"), keys = b.querySelector(".keys");
      let acc=null, op=null, fresh=true;
      const show = v => disp.textContent = String(v).slice(0,14);
      const apply = ()=>{ const cur=parseFloat(disp.textContent);
        if(op===null||acc===null) return cur;
        if(op==="+") return acc+cur; if(op==="-") return acc-cur;
        if(op==="*") return acc*cur; if(op==="/") return cur===0 ? "Cannot divide" : acc/cur;
        return cur; };
      [["C","CE","sqrt","/","*"],["7","8","9","-","+"],["4","5","6","1","2"],["3","0",".","+/-","="]]
      .flat().forEach(k=>{
        const btn=document.createElement("button"); btn.className="bo"; btn.textContent=k;
        btn.onclick=()=>{
          if(k>="0"&&k<="9"){ show(fresh?k:disp.textContent+k); fresh=false; }
          else if(k==="."){ if(!disp.textContent.includes(".")) { show(disp.textContent+"."); fresh=false; } }
          else if(k==="C"){ acc=null; op=null; show(0); fresh=true; }
          else if(k==="CE"){ show(0); fresh=true; }
          else if(k==="+/-"){ show(-parseFloat(disp.textContent)||0); }
          else if(k==="sqrt"){ const n=parseFloat(disp.textContent);
            show(n<0?"imaginary, dude":Math.sqrt(n)); fresh=true; }
          else if(k==="="){ show(apply()); acc=null; op=null; fresh=true; }
          else { acc=apply(); op=k; show(acc); fresh=true; }
        };
        keys.appendChild(btn);
      });
    }});
}

function openPaint(){
  createWindow({ id:"paint", title:"dweebPaint", icon:"paint", w:520, h:420,
    mount:(b)=>{
      b.innerHTML = '<div class="paintbar bthin">'+
        '<span class="pt bo on" data-t="pen">Pencil</span>'+
        '<span class="pt bo" data-t="spray">Spray</span>'+
        '<span class="pt bo" data-t="erase">Eraser</span>'+
        '<span class="pt bo" data-t="clear">Clear</span>'+
        '<span style="width:10px"></span><span id="sw"></span></div>'+
        '<div class="paintwrap bthin-in"><canvas width="640" height="420"></canvas></div>';
      const canvas = b.querySelector("canvas"), g = canvas.getContext("2d");
      g.fillStyle="#fff"; g.fillRect(0,0,640,420);
      let tool="pen", color="#000000", down=false;
      const cols=["#000000","#808080","#c00000","#ff8000","#e6b352","#008000","#008080","#0000c0","#800080","#ffffff"];
      const swd = b.querySelector("#sw");
      cols.forEach((c,i)=>{ const s=document.createElement("span");
        s.className="swatch bthin"+(i===0?" on":""); s.style.background=c;
        s.onclick=()=>{ color=c; swd.querySelectorAll(".swatch").forEach(x=>x.classList.remove("on")); s.classList.add("on"); };
        swd.appendChild(s); });
      b.querySelectorAll(".pt").forEach(p=>p.onclick=()=>{
        if(p.dataset.t==="clear"){ g.fillStyle="#fff"; g.fillRect(0,0,640,420); return; }
        tool=p.dataset.t;
        b.querySelectorAll(".pt").forEach(x=>x.classList.remove("on")); p.classList.add("on");
      });
      const pos = e=>{ const r=canvas.getBoundingClientRect();
        return [ (e.clientX-r.left)*(640/r.width), (e.clientY-r.top)*(420/r.height) ]; };
      const dot = (x,y)=>{
        if(tool==="pen"){ g.fillStyle=color; g.fillRect(x-1.5,y-1.5,3,3); }
        else if(tool==="erase"){ g.fillStyle="#fff"; g.fillRect(x-7,y-7,14,14); }
        else if(tool==="spray"){ g.fillStyle=color;
          for(let i=0;i<14;i++){ const a=Math.random()*6.28, r=Math.random()*11;
            g.fillRect(x+Math.cos(a)*r, y+Math.sin(a)*r, 1.4,1.4); } }
      };
      canvas.addEventListener("pointerdown", e=>{ down=true; dot(...pos(e)); });
      addEventListener("pointermove", e=>{ if(down) dot(...pos(e)); });
      addEventListener("pointerup", ()=>down=false);
    }});
}

function openSweeper(){
  createWindow({ id:"mine", title:"dweebSweeper", icon:"mine", w:216, h:296, fixed:true,
    mount:(b)=>{
      b.innerHTML = '<div class="mine"><div class="top bthin-in">'+
        '<span class="lcd" id="mc">010</span><span class="face bo" id="mf">&#9786;</span>'+
        '<span class="lcd" id="mt">000</span></div>'+
        '<div style="align-self:center;margin:2px 0"><span class="pt bo" id="flagmode" style="padding:2px 8px">Flag: off</span></div>'+
        '<div class="grid9 bthin-in" id="mg"></div></div>';
      const N=9, MINES=10;
      let cells, mines, opened, flags, dead, won, t0, timer, flagMode=false;
      const mc=b.querySelector("#mc"), mt=b.querySelector("#mt"),
            mf=b.querySelector("#mf"), mg=b.querySelector("#mg");
      b.querySelector("#flagmode").onclick=e=>{
        flagMode=!flagMode; e.target.textContent="Flag: "+(flagMode?"ON":"off"); };
      mf.onclick=init;
      function idx(x,y){ return y*N+x; }
      function neighbors(i){ const x=i%N, y=(i/N)|0, out=[];
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          if(!dx&&!dy) continue; const nx=x+dx, ny=y+dy;
          if(nx>=0&&nx<N&&ny>=0&&ny<N) out.push(idx(nx,ny)); }
        return out; }
      function init(){
        cells=[]; mines=new Set(); opened=new Set(); flags=new Set();
        dead=false; won=false; t0=null; clearInterval(timer);
        mt.textContent="000"; mf.innerHTML="&#9786;";
        while(mines.size<MINES) mines.add((Math.random()*N*N)|0);
        mg.innerHTML="";
        for(let i=0;i<N*N;i++){
          const c=document.createElement("div"); c.className="cell bo"; c.dataset.i=i;
          c.addEventListener("click", ()=> flagMode ? flag(i) : open(i));
          c.addEventListener("contextmenu", e=>{ e.preventDefault(); flag(i); });
          mg.appendChild(c); cells.push(c);
        }
        drawCount();
      }
      function drawCount(){ mc.textContent=String(Math.max(0,MINES-flags.size)).padStart(3,"0"); }
      function startClock(){ if(t0) return; t0=Date.now();
        timer=setInterval(()=>{ mt.textContent=String(Math.min(999,((Date.now()-t0)/1000)|0)).padStart(3,"0"); },250); }
      function flag(i){ if(dead||won||opened.has(i)) return; startClock();
        flags.has(i)?flags.delete(i):flags.add(i);
        cells[i].textContent=flags.has(i)?"⚑":""; cells[i].style.color="#c00000"; drawCount(); }
      function open(i){
        if(dead||won||flags.has(i)||opened.has(i)) return; startClock();
        if(mines.has(i)){ boom(i); return; }
        const q=[i];
        while(q.length){ const c=q.pop(); if(opened.has(c)||flags.has(c)) continue;
          opened.add(c); const el=cells[c]; el.classList.remove("bo"); el.classList.add("open");
          const n=neighbors(c).filter(x=>mines.has(x)).length;
          if(n){ el.textContent=n; el.classList.add("c"+n); }
          else neighbors(c).forEach(x=>{ if(!opened.has(x)) q.push(x); }); }
        if(opened.size===N*N-MINES){ won=true; clearInterval(timer); mf.textContent="B)";
          dialog("dweebSweeper","You swept every dweeb. "+mt.textContent+" seconds.","mine"); }
      }
      function boom(i){ dead=true; clearInterval(timer); mf.textContent="X(";
        mines.forEach(m=>{ cells[m].classList.remove("bo"); cells[m].classList.add("open");
          cells[m].textContent="✱"; });
        cells[i].classList.add("boom"); }
      init();
    }});
}

        '<button class="bo" id="a-stop">&#9632;</button>'+
        '<button class="bo" id="a-next">&#9654;|</button>'+
        '<span style="flex:1;text-align:right;font-size:12px">(audio not included — imagine harder)</span></div></div>';
      const eq=b.querySelector("#amp-eq");
      for(let i=0;i<14;i++){ const bar=document.createElement("i");
        bar.style.animationDelay=(i*0.09)+"s"; bar.style.animationDuration=(0.35+Math.random()*0.5)+"s";
        eq.appendChild(bar); }
      let ti=0, sec=0, playing=true, tick;
      const wrap=b.querySelector(".amp");
      const draw=()=>{ b.querySelector("#amp-t").textContent =
        (ti+1)+". "+AMP_TRACKS[ti]+" *** dwAMP: it really whips something's something *** ";
        b.querySelector("#amp-c").textContent = ((sec/60)|0)+":"+String(sec%60).padStart(2,"0"); };
      const run=()=>{ clearInterval(tick); tick=setInterval(()=>{ if(playing){ sec++; draw(); } },1000); };
      b.querySelector("#a-play").onclick=()=>{ playing=!playing; wrap.classList.toggle("paused",!playing); };
      b.querySelector("#a-stop").onclick=()=>{ playing=false; sec=0; wrap.classList.add("paused"); draw(); };
      b.querySelector("#a-prev").onclick=()=>{ ti=(ti+AMP_TRACKS.length-1)%AMP_TRACKS.length; sec=0; draw(); };
      b.querySelector("#a-next").onclick=()=>{ ti=(ti+1)%AMP_TRACKS.length; sec=0; draw(); };
      draw(); run();
    }});
}

/* My Computer: two-level fake explorer */
const FS = {
  "C:\\": [ ["folder","My Documents"], ["folder","Windows"], ["folder","Games"], ["doc","README.TXT"] ],
  "C:\\My Documents": [ ["doc","my_diary_DO_NOT_READ.txt"], ["doc","ideas.txt"] ],
  "C:\\Windows": [ ["doc","win.ini"], ["doc","system.ini"], ["doc","llama.dll"] ],
  "C:\\Games": [ ["mine","dweebSweeper.lnk"] ],
};
const FILETEXT = {
  "README.TXT": "WELCOME TO YOUR NEW COMPUTER\n\n1. Do not delete llama.dll. Nobody knows what it does.\n2. The internet is in the other icon.\n3. This computer is a website. Try not to think about it.",
  "my_diary_DO_NOT_READ.txt": "dear diary,\n\nyou were in the recycle bin. someone RESTORED you. the disrespect.\n\nanyway. today i multi-tasked 4 things and finished 0. personal best.",
  "ideas.txt": "SITE IDEAS (do not steal)\n- page of tv quotes but every quote is VERIFIED. like with sources\n- a game where you just run. one button.\n- honeycomb but it is also a menu??\n- windows 95 but it is a website (too ambitious, skip)",
  "win.ini": "[windows]\nload=\nrun=\nvibes=immaculate",
  "system.ini": "[boot]\nshell=dweeb95\n[386Enh]\ndevice=llama.dll",
  "llama.dll": "01001100 01001100 01000001 01001101 01000001\n\n(you were warned not to open this)",
};
function openMyComputer(){
  createWindow({ id:"mycomp", title:"My Computer", icon:"computer", w:420, h:320,
    mount:(b)=>{
      b.innerHTML = '<div class="menubar"><span class="mi" id="fc-up">&#8679; Up</span>'+
        '<span style="flex:1"></span><span class="mi" id="fc-path" style="pointer-events:none"></span></div>'+
        '<div class="fileview bthin-in" id="fc-view"></div>';
      let path = null;  /* null = drive list */
      const view = b.querySelector("#fc-view"), pl = b.querySelector("#fc-path");
      b.querySelector("#fc-up").onclick = ()=>{ 
        if(path===null) return;
        path = path==="C:\\" ? null : "C:\\";
        drawFC(); };
      function item(ic, label, fn){
        const d=document.createElement("div"); d.className="fitem";
        d.innerHTML='<img src="'+icon(ic,32)+'" alt=""><span class="fl"></span>';
        d.querySelector(".fl").textContent=label;
        let last=0;
        d.addEventListener("click",()=>{ const n=Date.now(); if(n-last<500){ last=0; fn(); } else last=n; });
        view.appendChild(d);
      }
      function drawFC(){
        view.innerHTML="";
        if(path===null){
          pl.textContent="My Computer";
          item("computer","(C:) the only drive", ()=>{ path="C:\\"; drawFC(); });
          item("folder","(D:) CD-ROM", ()=>dialog("D:\\","The tray opens. It is empty.<br>It has always been empty.","folder"));
          return;
        }
        pl.textContent=path;
        (FS[path]||[]).forEach(([ic,name])=>{
          item(ic, name, ()=>{
            const full = path.replace(/\\$/,"")+"\\"+name;
            if(ic==="folder"){ path=full; drawFC(); }
            else if(name==="dweebSweeper.lnk") openSweeper();
            else openNotepad(FILETEXT[name]||"(empty)", name);
          });
        });
      }
      drawFC();
    }});
}

function openRecycle(){
  createWindow({ id:"bin", title:"Recycle Bin", icon:"bin", w:380, h:280,
    mount:(b)=>{
      b.innerHTML = '<div class="menubar"><span class="mi" id="rb-empty">Empty Recycle Bin</span></div>'+
        '<div class="fileview bthin-in" id="rb-view"></div>';
      const view=b.querySelector("#rb-view");
      const items=[
        ["doc","netscape_installer.exe", "You deleted this the day dweebscape shipped. Loyalty."],
        ["doc","my_diary_DO_NOT_READ.txt", "Restore it? It lives in C:\\My Documents now. It knows what you did."],
        ["doc","aol_free_trial_disc.exe", "700 free hours. The disc is also a coaster."],
      ];
      items.forEach(([ic,name,msg])=>{
        const d=document.createElement("div"); d.className="fitem";
        d.innerHTML='<img src="'+icon(ic,32)+'" alt=""><span class="fl"></span>';
        d.querySelector(".fl").textContent=name;
        let last=0; d.addEventListener("click",()=>{ const n=Date.now();
          if(n-last<500) dialog(name,msg,"bin"); last=n; });
        view.appendChild(d);
      });
      b.querySelector("#rb-empty").onclick=()=>{
        view.innerHTML='<div style="color:#888;padding:20px">(empty. you monster.)</div>'; };
    }});
}

function openDisplayProps(){
  createWindow({ id:"disp", title:"Display Properties", icon:"gear", w:300, h:210, fixed:true,
    mount:(b)=>{
      b.innerHTML = '<div class="dlg" style="flex-direction:column;gap:10px">'+
        '<div><b>Wallpaper</b> — pick a vibe:</div>'+
        '<div style="display:flex;gap:8px">'+
        '<button class="bo" data-w="">Teal Classic</button>'+
        '<button class="bo" data-w="wp-hex">Comb Dots</button>'+
        '<button class="bo" data-w="wp-check">Checkers</button>'+
        '<button class="bo" data-w="wp-gray">Server Room</button></div>'+
        '<div style="color:#666">Changes apply instantly. This is the most functional Settings panel of 1996.</div></div>'+
        '<div class="dlgbtns"><button id="dp-ok">OK</button></div>';
      b.querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>{
        desk.className = x.dataset.w; });
      b.querySelector("#dp-ok").onclick=()=>closeWin("disp");
      b.querySelectorAll("button").forEach(x=>{ x.style.cssText+="border:0;background:var(--chrome);font:11px Tahoma;padding:4px 8px"; });
    }});
}

function openRun(){
  createWindow({ id:"run", title:"Run", icon:"doc", w:330, h:150, fixed:true,
    mount:(b)=>{
      b.innerHTML='<div class="dlg"><img src="'+icon("doc",32)+'" alt=""><div class="msg">'+
        'Type the name of a program or fake website:<br><br>'+
        '<input id="run-in" class="bthin-in" style="width:100%;font:11px Tahoma;padding:3px;border:0;background:#fff"></div></div>'+
        '<div class="dlgbtns"><button id="run-ok">OK</button><button id="run-x">Cancel</button></div>';
      const inp=b.querySelector("#run-in");
      const go=()=>{
        const v=inp.value.toLowerCase().trim(); closeWin("run");
        if(!v) return;
        if(v.includes("note")) openNotepad();
        else if(v.includes("paint")) openPaint();
        else if(v.includes("calc")) openCalc();
        else if(v.includes("sweep")||v.includes("mine")) openSweeper();
        else if(v.includes("amp")||v.includes("music")) openAmp();
        else if(v.includes("format c")) dialog("Nice try","No.","shut");
        else if(PAGES[v] || v.includes("dweeb")||v.includes("http")||v.includes("www")) window.navigateTo(PAGES[v]?v:"home");
        else dialog("Error","Cannot find \""+inp.value.replace(/[<>&"]/g,"")+"\".<br>This computer contains four programs and a dream.","doc");
      };
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
      b.querySelector("#run-ok").onclick=go;
      b.querySelector("#run-x").onclick=()=>closeWin("run");
      setTimeout(()=>inp.focus(),50);
    }});
}

/* ════════════════ desktop, start menu, boot ════════════════ */
const DESKTOP_ICONS = [
  ["computer","My Computer", openMyComputer],
  ["bin","Recycle Bin", openRecycle],
  ["net","Network Neighborhood", ()=>dialog("Network Neighborhood",
     "Scanning network...<br><br>No other computers found.<br>(Is the phone line plugged into the modem?)","net")],
  ["web","dweebscape Navigator", ()=>openNavigator()],
  ["amp","dwAMP", openAmp],
  ["mine","dweebSweeper", openSweeper],
];
function buildDesktop(){
  const box = document.getElementById("icons");
  DESKTOP_ICONS.forEach(([ic,label,fn])=>{
    const d=document.createElement("div"); d.className="dicon";
    d.innerHTML='<img src="'+icon(ic,32)+'" alt=""><span class="lbl"></span>';
    d.querySelector(".lbl").textContent=label;
    let last=0;
    d.addEventListener("click",()=>{
      document.querySelectorAll(".dicon").forEach(x=>x.classList.remove("sel"));
      d.classList.add("sel");
      const n=Date.now(); if(n-last<500) fn(); last=n;
    });
    box.appendChild(d);
  });
  desk.addEventListener("click", e=>{ if(e.target===desk)
    document.querySelectorAll(".dicon").forEach(x=>x.classList.remove("sel")); });
}

function buildStartMenu(){
  const items = document.getElementById("smenu-items");
  const mk = (ic,label,fn,sub)=>{
    const d=document.createElement("div"); d.className="it";
    d.innerHTML='<img src="'+icon(ic,24)+'" alt=""><span></span>'+(sub?'<span class="arr">&#9656;</span>':'');
    d.querySelector("span").textContent=label;
    if(fn) d.addEventListener("click",()=>{ toggleStart(false); fn(); });
    if(sub){
      const s=document.createElement("div"); s.className="sub bo";
      sub.forEach(([sic,sl,sfn])=>{
        const si=document.createElement("div"); si.className="it";
        si.innerHTML='<img src="'+icon(sic,16)+'" alt=""><span></span>';
        si.querySelector("span").textContent=sl;
        si.addEventListener("click",e=>{ e.stopPropagation(); toggleStart(false); sfn(); });
        s.appendChild(si);
      });
      d.appendChild(s);
    }
    items.appendChild(d);
  };
  mk("folder","Programs", null, [
    ["web","dweebscape Navigator", ()=>openNavigator()],
    ["note","dweebPad", ()=>openNotepad()],
    ["paint","dweebPaint", openPaint],
    ["calc","dweebCalc", openCalc],
    ["mine","dweebSweeper", openSweeper],
    ["amp","dwAMP", openAmp],
  ]);
  mk("folder","Documents", null, [
    ["doc","my_diary_DO_NOT_READ.txt", ()=>openNotepad(FILETEXT["my_diary_DO_NOT_READ.txt"],"my_diary_DO_NOT_READ.txt")],
    ["doc","ideas.txt", ()=>openNotepad(FILETEXT["ideas.txt"],"ideas.txt")],
  ]);
  mk("gear","Settings", openDisplayProps);
  mk("doc","Find", ()=>dialog("Find: All Files","Found 1 item:<br><br>&nbsp;&nbsp;you.<br><br>Hello.","doc"));
  mk("web","Help", ()=>window.navigateTo("help"));
  const sep=document.createElement("div"); sep.className="sep"; sep.style.cssText="height:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 1px"; items.appendChild(sep);
  mk("doc","Run...", openRun);
  const sep2=sep.cloneNode(); items.appendChild(sep2);
  mk("shut","Shut Down...", doShutdown);
}
function toggleStart(force){
  const m=document.getElementById("smenu"), b=document.getElementById("startbtn");
  const show = force!==undefined ? force : m.style.display!=="block";
  m.style.display = show ? "block" : "none";
  b.classList.toggle("on", show);
}
document.getElementById("startbtn").addEventListener("click", e=>{ e.stopPropagation(); toggleStart(); });
document.addEventListener("pointerdown", e=>{
  if(!e.target.closest("#smenu") && !e.target.closest("#startbtn")) toggleStart(false);
});

function doShutdown(){
  const s=document.getElementById("shutdown");
  s.style.display="flex";
  s.onclick=()=>location.reload();
}

/* boot */
const BOOTMSGS = [
  "Starting dweeb 95","Loading HIMEM.SYS","Loading EMM386.EXE","Initializing disk cache",
  "Verifying DMI Pool Data","Detecting Plug and Play devices","Untangling the phone cord",
  "Negotiating with the modem","Loading dweebscape Navigator 3.0","Warming up the CRT",
  "Checking for mail (there is no mail)","Ready",
];
let bootI=0;
function bootTick(){
  const bar=document.getElementById("bootbar"), txt=document.getElementById("boottxt");
  if(bootI>=BOOTMSGS.length){ setTimeout(startDesktop,400); return; }
  txt.textContent=BOOTMSGS[bootI]+"...";
  bar.style.width=Math.min(100,(bootI/BOOTMSGS.length)*100)+"%";
  bootI++;
  setTimeout(bootTick, bootI===BOOTMSGS.length?600:(140+Math.random()*200));
}
function startDesktop(){
  document.getElementById("boot").style.display="none";
  desk.style.display="block";
  document.getElementById("startlogo").src=icon("web",16);
  document.getElementById("trayspk").src=icon("spk",14);
  buildDesktop();
  buildStartMenu();
  updateClock(); setInterval(updateClock,1000);
  openNavigator("enter");
}
function updateClock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
}
setTimeout(bootTick, 700);
